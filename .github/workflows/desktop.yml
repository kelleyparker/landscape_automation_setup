name: Desktop builds

# Builds the Electron shell for macOS and Windows - the artefacts you would
# upload to Steamworks. Runs on a version tag, or on demand.
#
# Artefacts are UNSIGNED. macOS will refuse to open an unsigned .app without a
# right-click -> Open, and Windows SmartScreen will warn. Signing needs an Apple
# Developer ID ($99/yr) and a Windows code-signing certificate; wire those in as
# secrets when you have them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
            artifact: macos
          - os: windows-latest
            target: dist:win
            artifact: windows
          - os: ubuntu-latest
            target: dist:linux
            artifact: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the game
        run: |
          npm ci
          npm run build

      - name: Install desktop shell deps
        working-directory: desktop
        run: npm install

      - name: Verify the desktop shell actually renders
        # This is the important gate. The shell's most likely failure - ES
        # modules blocked over file:// - opens a window perfectly and paints
        # nothing, so "it launched" proves nothing. Smoke mode renders the game,
        # captures the window and fails if the frame is blank.
        working-directory: desktop
        shell: bash
        env:
          WAVEBREAK_SMOKE: smoke.png
        run: |
          npm run stage
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a --server-args="-screen 0 1600x900x24" \
              npx electron . --no-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
          else
            npx electron .
          fi

      - name: Package
        working-directory: desktop
        run: npm run ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: wavebreak-${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/smoke.png
          if-no-files-found: warn
          retention-days: 30
