name: Deploy web build

# Publishes the playable build to GitHub Pages and (if a butler key is present)
# to itch.io. Typecheck and build run first, so a broken commit can never reach
# a public URL.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; cancel an in-flight one if a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke-test the built game in a real browser
        # The build succeeding proves the bundler was happy, not that the game
        # runs - a shader that fails to compile is a clean build and a black
        # screen. The harness boots the real thing and exits non-zero on any
        # console or page error.
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          npx wait-on http://127.0.0.1:4173 || sleep 5
          node tools/shoot.mjs --shots chase,aerial --time 20 --port 4173 --out shots/ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-frames
          path: shots/ci
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-itch:
    needs: build
    runs-on: ubuntu-latest
    # Secrets cannot be referenced in a job-level `if`, so gate on an env var.
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}   # e.g. kelleyparker/wavebreak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci && npm run build
        if: env.BUTLER_API_KEY != ''

      - name: Push to itch.io
        if: env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler push dist "$ITCH_TARGET:html5" --userversion "1.0.${{ github.run_number }}"

      - name: Explain the skip
        if: env.BUTLER_API_KEY == '' || env.ITCH_TARGET == ''
        run: |
          echo "Skipped itch.io deploy."
          echo "To enable it: add repository secret BUTLER_API_KEY (itch.io -> Settings -> API keys)"
          echo "and repository variable ITCH_TARGET (e.g. kelleyparker/wavebreak)."
