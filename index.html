<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WAVEBREAK</title>
    <!--
      Favicon drawn inline, like everything else in this project: a cel wave crest
      in the Tropic Ink palette. Keeps the "zero external assets" rule intact and
      stops the browser requesting /favicon.ico, which was the only error the
      screenshot harness ever reported.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231873cf'/%3E%3Cpath d='M2 44c10 0 12-10 22-10s12 10 22 10 12-6 16-6v20H2z' fill='%230a3a78'/%3E%3Cpath d='M2 34c10 0 12-12 22-12s12 12 22 12 12-7 16-7v10c-4 0-8 6-16 6s-12-10-22-10-12 10-22 10z' fill='%23eefcff'/%3E%3Cpath d='M6 20c6-6 14-8 20-4' stroke='%237ee8f5' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #0d1b3a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      /* HUD overlay canvas sits above the WebGL canvas, never eats pointer events. */
      #hud { position: fixed; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="hud"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
